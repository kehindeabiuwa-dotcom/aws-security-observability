<text x="78" y="322.75" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172942">1 / Generate event</text>
<text x="78" y="359.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">Read dummy secret</text>
<text x="78" y="386.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">Do not print its value</text>
<rect x="445" y="280" width="325" height="155" rx="16" fill="#ffffff" stroke="#cad5e4" stroke-width="2"/>
