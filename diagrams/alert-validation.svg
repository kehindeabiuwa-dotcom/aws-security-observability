<text x="443" y="707.75" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172942">Record the test result</text>
<text x="443" y="744.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">Capture timestamps, log event, alarm history and email.</text>
<text x="443" y="771.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">A repeated read while ALARM may produce no new email.</text>
<text x="443" y="798.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">A missing event and a delivery failure are different problems.</text>
