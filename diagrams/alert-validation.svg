<text x="468" y="322.75" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172942">2 / Find audit event</text>
<text x="468" y="359.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">GetSecretValue</text>
<text x="468" y="386.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">Check errorCode + identity</text>
<rect x="835" y="280" width="325" height="155" rx="16" fill="#ffffff" stroke="#cad5e4" stroke-width="2"/>
<rect x="835" y="280" width="8" height="155" rx="3" fill="#7855b5" stroke="#7855b5" stroke-width="2"/>
<text x="858" y="322.75" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172942">3 / Check metric</text>
<text x="858" y="359.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">Successful or denied count</text>
<text x="858" y="386.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">Sum, not Average</text>
<rect x="1225" y="280" width="325" height="155" rx="16" fill="#ffffff" stroke="#cad5e4" stroke-width="2"/>
<rect x="1225" y="280" width="8" height="155" rx="3" fill="#c95166" stroke="#c95166" stroke-width="2"/>
<text x="1248" y="322.75" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172942">4 / Check notification</text>
<text x="1248" y="359.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">OK → ALARM transition</text>
<text x="1248" y="386.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172942">Confirmed SNS subscriber</text>
